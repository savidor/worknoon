# One command to run everything:  docker compose up --build
# Open http://localhost:8080  (customer chat, support console, policy)
#
# The AI key is optional. Without it, the app runs in offline mode (heuristic
# extraction + template replies). Put GEMINI_API_KEY in a .env file next to this file.

name: refund-desk

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: refunddesk
      POSTGRES_PASSWORD: refunddesk
      POSTGRES_DB: refunddesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refunddesk -d refunddesk"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://refunddesk:refunddesk@db:5432/refunddesk
      AUTO_MIGRATE: "true"
      SEED_ON_BOOT: "true"
      SEED_SAMPLE_ACTIVITY: ${SEED_SAMPLE_ACTIVITY:-true}
      DEMO_MODE: ${DEMO_MODE:-true}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-this-is-a-dev-only-secret}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-worknoon-admin}
      CORS_ORIGINS: http://localhost:8080
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3-flash-preview,gemini-3.1-flash-lite,gemini-3.5-flash-lite}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-15000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
