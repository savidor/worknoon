server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Security headers for every response. Locations below deliberately avoid add_header,
  # because any add_header inside a location silently drops these inherited ones.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Container health check; kept out of the access log so it does not drown real traffic.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The edge sets these once for the whole site; drop the API's copies to avoid duplicates.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    # AI calls can take several seconds; the backend enforces its own timeout.
    proxy_read_timeout 90s;
    client_max_body_size 32k;
  }

  # Hashed build assets never change, so cache them for a year.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Client-side routing: unknown paths fall back to the SPA. The shell is always revalidated.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
